<header class="site-header">
  <div class="container header-inner">
    <div class="site-heading">
      <h1 class="site-title">{{ page.header_title | default: site.title }}</h1>
      {% if page.header_subtitle %}<p class="site-subtitle">{{ page.header_subtitle }}</p>{% endif %}
    </div>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open navigation menu">
      <span class="nav-toggle-bars" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span class="sr-only">Menu</span>
    </button>

    <nav class="top-nav" id="primary-navigation" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} class="is-active" aria-current="page"{% endif %}{% if item.new_tab %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
